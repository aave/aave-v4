name: Snapshot to private repo (cross-org)
on:
  push:
    branches: [testing-pipeline]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: aave-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build snapshot tree
        run: |
          mkdir -p /tmp/snap
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'lib' \
            . /tmp/snap/

          cd /tmp/snap
          git init
          git add .
          git -c user.name="Snapshot Bot" -c user.email="snapshot-bot@local" commit -m "Snapshot: ${GITHUB_SHA}"
          git branch -M main

          # Add submodule with actual content at the same commit as source
          FORGE_STD_COMMIT=$(cd "${GITHUB_WORKSPACE}" && git submodule status lib/forge-std | awk '{print $1}' | sed 's/^[-+]//')
          git submodule add https://github.com/foundry-rs/forge-std.git lib/forge-std
          cd lib/forge-std
          git checkout $FORGE_STD_COMMIT
          cd ../..
          git add .gitmodules lib/forge-std
          git commit -m "Add submodule content at commit $FORGE_STD_COMMIT"

      - name: Create GitHub App token for target repo
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: adamavaralabs
          repositories: aave-v4

      - name: Push to snapshot repo (replace everything)
        run: |
          cd /tmp/snap
          git branch -M main
          # Remove any existing remote and add fresh one
          git remote remove origin 2>/dev/null || true
          git remote add origin https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/adamavaralabs/aave-v4.git
          git push origin main --force   # keep a single-commit repo

      - name: Clean up
        if: always()
        run: |
          rm -rf /tmp/snap
