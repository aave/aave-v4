name: Tests-PR

on:
  pull_request:

jobs:
  lint:
    name: Prettier lint check
    uses: bgd-labs/github-workflows/.github/workflows/foundry-lint-prettier.yml@main
  test:
    name: Foundry build n test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.READ_ONLY_PAT || github.token }}

      - name: Run Foundry setup
        uses: bgd-labs/github-workflows/.github/actions/foundry-setup@main
        with:
          FOUNDRY_VERSION: stable

      - name: Run Forge size
        uses: bgd-labs/github-workflows/.github/actions/foundry-size@main

      - name: Run Gas report
        uses: bgd-labs/github-workflows/.github/actions/foundry-gas-report@main

      # - name: Run Forge tests
      #   uses: bgd-labs/github-workflows/.github/actions/foundry-test@main
      #   with:
      #     FOUNDRY_PROFILE: pr
      #     FORGE_SNAPSHOT_CHECK: true

      - name: Download previous sizes report
        if: ${{ github.event_name == 'pull_request' }}
        uses: dawidd6/action-download-artifact@72aaadce3bc708349fc665eee3785cbb1b6e51d0 # v3.1.1
        with:
          branch: ${{ github.base_ref }}
          name: lcov-report
          if_no_artifact_found: warn
          path: lcov
          check_artifacts: true

      - uses: bgd-labs/action-foundry-lcov@main
        id: lcov
        with:
          ROOT_REPORT_PATH: "lcov/lcov.info" # The path to the first contract to compare
          REPORT_PATH: "lcov.info" # The path to the second contract to compare
          COVERAGE_COMMAND: "make coverage"

      - name: Prepare comment
        shell: bash
        run: |
          printf '%s' "${{ steps.lcov.outputs.report }}" > /tmp/content/lcov.txt

      - name: Move lcov to cache
        shell: bash
        run: |
          mkdir -p lcov
          mv lcov.info lcov/lcov.info

      - name: Cache Save
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: lcov-report
          path: lcov/lcov.info

      - name: Upload & Trigger Comment artifact
        uses: bgd-labs/github-workflows/.github/actions/comment-artifact@main
        with:
          nameSuffix: "default"
