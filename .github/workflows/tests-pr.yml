name: Tests-PR

on:
  pull_request:

jobs:
  lint:
    name: Prettier lint check
    uses: bgd-labs/github-workflows/.github/workflows/foundry-lint-prettier.yml@main
  test:
    name: Foundry build n test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.READ_ONLY_PAT || github.token }}

      - name: Run Foundry setup
        uses: bgd-labs/github-workflows/.github/actions/foundry-setup@main
        with:
          FOUNDRY_VERSION: nightly

      - name: Print forge version
        run: forge --version

      - name: Run targeted Forge test
        env:
          FOUNDRY_PROFILE: pr
          FORGE_SNAPSHOT_CHECK: "false"
        run: |
          forge test \
            --match-path tests/unit/Spoke/Liquidations/Spoke.LiquidationCall.Premium.t.sol \
            --match-test test_liquidationCall_fuzz_ManyCollaterals_ManyDebts_UserInsolvent \
            -vvvvv --decode-internal
